p:6px;border-bottom:1px solid var(--line);margin-top:27px}.tabs button{border:0;background:none;padding:13px 15px;color:#8290a2;font-size:10px;font-weight:700;border-bottom:2px solid transparent}.tabs button.active{color:var(--navy);border-color:var(--gold)}.adminbody{padding-top:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:17px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px}.stat small{font-size:8px;letter-spacing:.13em;color:#919baa}.stat b{display:block;font:800 25px Manrope;margin-top:6px}.attempt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin:8px 0}.avatar{width:35px;height:35px;border-radius:50%;background:#eaf0f6;color:#536b8a;display:grid;place-items:center;font-weight:800}.person{flex:1}.person b{display:block;font-size:11px}.person small{display:block;font-size:9px;color:#929baa;margin-top:4px}.status{font-size:8px;font-weight:800;padding:6px 9px;border-radius:20px;background:#f5eddf;color:#997544}.status.graded{background:#e7f2ed;color:var(--green)}.score{font:700 11px Manrope;min-width:62px;text-align:right}.iconbtn{border:0;background:none;color:#7b899c;font-size:18px}.empty{background:#fff;border:1px dashed #d7dfe8;border-radius:13px;text-align:center;padding:45px 15px;color:#8491a3}.empty b{display:block;color:var(--ink);margin:10px}.empty p{font-size:10px}.builder,.bank,.settings{background:#fff;border:1px solid var(--line);border-radius:12px;padding:19px;margin:12px 0}.builder h3,.bank h3,.settings h3{font:700 15px Manrope;margin:0 0 13px}.builder label{display:block;font-size:10px;font-weight:700;color:#77859a;margin:9px 0}.buildergrid{display:grid;grid-template-columns:1fr 1fr 100px;gap:9px}.bank h3 small{font:500 9px "DM Sans";color:#9aa4b2;margin-left:8px}.bankrow{display:flex;align-items:center;gap:10px;border-top:1px solid #f0f2f5;padding:12px 0}.bankrow>div{flex:1}.bankrow b{display:block;fon </style></head><body>
<header class="top"><button class="brand" onclick="home()"><span class="mark">A1</span><span><b>Deutschprüfung</b><small>GOETHE · START DEUTSCH 1</small></span></button><div class="topright"><span class="local">Lokal gespeichert</span><button class="btn" onclick="openAdmin()">Admin ↗</button></div></header><div id="toast" class="toast" hidden></div><main id="app"></main>
<script>
const KEY='goethe-a1-local-v1',DB='goethe-a1-media-v1';
const parts=[{id:'hoeren',title:'Hören',en:'Listening',time:20,points:15,icon:'◖))',desc:'Hörtexte verstehen und Fragen beantworten.'},{id:'lesen',title:'Lesen',en:'Reading',time:25,points:15,icon:'▤',desc:'Kurze Texte, Anzeigen und Mitteilungen verstehen.'},{id:'schreiben',title:'Schreiben',en:'Writing',time:20,points:15,icon:'✎',desc:'Ein Formular ausfüllen und eine kurze Nachricht schreiben.'},{id:'sprechen',title:'Sprechen',en:'Speaking',time:15,points:15,icon:'♬',desc:'Sich vorstellen, Fragen stellen und um etwas bitten.'}];
const seed={hoeren:[],lesen:[],schreiben:[{id:'w1',type:'text',prompt:'Teil 1 · Formular ausfüllen',question:'Ergänzen Sie die fünf fehlenden Informationen in einem Anmeldeformular. Schreiben Sie Ihre Antworten in das Feld.',points:5},{id:'w2',type:'text',prompt:'Teil 2 · Eine kurze Nachricht schreiben',question:'Sie möchten Susanne und Paul zu Ihrem Geburtstag einladen. Schreiben Sie eine kurze E-Mail. Schreiben Sie etwas zu: Warum schreiben Sie? · Datum und Uhrzeit? · Wie können sie kommen?',points:10}],sprechen:[{id:'s1',type:'recording',prompt:'Teil 1 · Sich vorstellen',question:'Stellen Sie sich bitte vor: Name, Alter, Land, Wohnort, Sprachen, Beruf und Hobby.',points:5},{id:'s2',type:'recording',prompt:'Teil 2 · Fragen und Antworten',question:'Stellen Sie Fragen und geben Sie Informationen zu einem Alltagsthema.',points:5},{id:'s3',type:'recording',prompt:'Teil 3 · Bitten formulieren und reagieren',question:'Formulieren Sie eine Bitte und reagieren Sie auf eine Bitte.',points:5}]};
let state=load(),screen='home',admin=false,tab='attempts',candidate={name:'',email:''},attempt=null,answers={},written={},recorded={},part=0,qi=0,remaining=0,tick=null,selected=null,rec=null,liveStream=null,draft={section:'hoeren',type:'mcq',prompt:'',question:'',options:['','',''],answer:0,points:1};
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));return s?{questions:{...seed,...s.questions},attempts:s.attempts||[],config:s.config||{hash:''},activeAttempt:s.activeAttempt||null}:{questions:seed,attempts:[],config:{hash:''},activeAttempt:null}}catch(e){return{questions:seed,attempts:[],config:{hash:''}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.hidden=false;setTimeout(()=>e.hidden=true,3000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function put(k,b){let d=await db();return new Promise((ok,no)=>{let t=d.transaction('media','readwrite');t.objectStore('media').put(b,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function get(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction('media').objectStore('media').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
async function hash(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function home(){if(tick)clearInterval(tick);screen='home';render()}
function openAdmin(){document.getElementById('modalroot')?.remove();let setup=!state.config.hash;modal(setup?'Admin-Passwort festlegen':'Admin-Anmeldung',setup?'Lege ein Passwort für diesen Browser fest.':'Gib dein Admin-Passwort ein.',`<label class="field">Passwort<input id="adminpass" type="password" placeholder="Mindestens 8 Zeichen" autofocus></label><button class="primary" onclick="adminLogin(${setup})">${setup?'Passwort speichern':'Anmelden'} →</button>`)}
async function adminLogin(setup){let p=document.getElementById('adminpass').value;if(setup&&p.length<8){toast('Mindestens 8 Zeichen verwenden.');return}let h=await hash(p);if(setup){state.config.hash=h;save()}else if(h!==state.config.hash){toast('Falsches Passwort.');return}admin=true;screen='admin';document.getElementById('modalroot').remove();render()}
function modal(title,desc,body){let old=document.getElementById('modalroot');if(old)old.remove();let d=document.createElement('div');d.id='modalroot';d.className='modalbg';d.innerHTML=`<div class="modal"><button class="close" onclick="document.getElementById('modalroot').remove()">×</button><span class="kicker">GESCHÜTZTER BEREICH</span><h2>${esc(title)}</h2><p>${esc(desc)}</p>${body}</div>`;d.addEventListener('click',e=>{if(e.target===d)d.remove()});document.body.append(d);setTimeout(()=>document.getElementById('adminpass')?.focus(),50)}
function start(){if(!candidate.name.trim()){toast('Bitte Namen eingeben.');return}attempt={id:uid(),name:candidate.name.trim(),email:candidate.email.trim(),started:new Date().toISOString(),answers:{},written:{},recorded:[],marks:{},status:'submitted'};answers={};written={};recorded={};part=0;qi=0;remaining=parts[0].time*60;screen='exam';persist();runTimer();render()}
function runTimer(){if(tick)clearInterval(tick);tick=setInterval(()=>{remaining--;let t=document.getElementById('timer');if(t)t.textContent=fmt(remaining);if(remaining%5===0)persist();if(remaining<=0){clearInterval(tick);advancePart(true)}},1000)}
function fmt(n){return Math.floor(Math.max(0,n)/60).toString().padStart(2,'0')+':'+(Math.max(0,n)%60).toString().padStart(2,'0')}
function questions(){return state.questions[parts[part].id]||[]}
function persist(){if(!attempt)return;attempt.answers={...answers};attempt.written={...written};attempt.recorded=[...new Set([...(attempt.recorded||[]),...Object.keys(recorded).filter(k=>recorded[k])])];state.activeAttempt={attempt,answers:{...answers},written:{...written},recorded:{...recorded},part,qi,remaining};save()}
function setAns(id,v){answers[id]=v;persist()}
function setText(id,v){written[id]=v;persist()}
async function recordStart(id){try{liveStream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(liveStream);let chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{await put('student-'+attempt.id+'-'+id,new Blob(chunks,{type:rec.mimeType||'audio/webm'}));recorded[id]=true;attempt.recorded=[...new Set([...attempt.recorded,id])];liveStream.getTracks().forEach(t=>t.stop());persist();render();toast('Aufnahme gespeichert.')} ;rec.start();document.getElementById('recordbtn').textContent='Aufnahme läuft – stoppen';document.getElementById('recordbtn').onclick=recordStop}catch(e){toast('Mikrofonzugriff nicht möglich. Bitte Berechtigung erlauben.')}} 
function recordStop(){if(rec&&rec.state==='recording')rec.stop()}
async function play(k){let b=await get(k);if(!b){toast('Für diese Aufgabe wurde noch keine Audiodatei hochgeladen.');return}let u=URL.createObjectURL(b),a=new Audio(u);a.onended=()=>URL.revokeObjectURL(u);a.play()}
function nextQ(){if(qi<questions().length-1){qi++;persist();render()}else advancePart(false)}
function advancePart(auto){if(part<3){part++;qi=0;remaining=parts[part].time*60;persist();runTimer();render()}else finish(auto)}
function finish(auto){if(rec&&rec.state==='recording')recordStop();if(tick)clearInterval(tick);attempt.answers={...answers};attempt.written={...written};attempt.finished=new Date().toISOString();attempt.auto=auto;state.attempts.unshift(attempt);state.activeAttempt=null;save();attempt=null;screen='result';render();toast(auto?'Zeit abgelaufen. Antworten gespeichert.':'Prüfung abgegeben.')}
function autoScore(a){let n=0;for(let s of parts)for(let q of state.questions[s.id]||[])if(q.type==='mcq'&&a.answers?.[q.id]===Number(q.answer))n+=Number(q.points||1);return n}
function totalMark(a){let n=autoScore(a);for(let s of parts)for(let q of state.questions[s.id]||[])if(q.type!=='mcq')n+=Number(a.marks?.[q.id]||0);return n}
function adminTab(t){tab=t;render()}
function addQuestion(){let s=draft.section,q={...draft,id:uid(),points:Number(draft.points)||1};if(!q.prompt.trim()||!q.question.trim()){toast('Titel und Aufgabenstellung fehlen.');return}if(q.type==='mcq'&&q.options.some(x=>!x.trim())){toast('Bitte alle drei Antwortmöglichkeiten ausfüllen.');return}state.questions[s].push(q);save();draft={...draft,prompt:'',question:''};render();toast('Aufgabe hinzugefügt.')}
function delQuestion(s,id){if(!confirm('Aufgabe löschen?'))return;state.questions[s]=state.questions[s].filter(q=>q.id!==id);save();render()}
async function uploadAudio(id,file){if(!file)return;await put('question-'+id,file);toast('Hördatei gespeichert.')}
function mark(id,qid,v){let a=state.attempts.find(x=>x.id===id);a.marks[qid]=Math.max(0,Number(v)||0);save()}
function openSubmission(id){selected=state.attempts.find(a=>a.id===id);let html=parts.map(s=>`<section class="marksec"><h3>${s.title}</h3>${(state.questions[s.id]||[]).map(q=>{let ans=q.type==='mcq'?(q.options?.[selected.answers?.[q.id]]??'Nicht beantwortet'):q.type==='text'?(selected.written?.[q.id]||'Keine Antwort abgegeben.'):'Audioaufnahme';return `<div class="markitem"><b>${esc(q.prompt)}</b><p>${esc(q.question)}</p><p>${esc(ans)}</p>${q.type==='recording'?'<button class="btn" onclick="play(\'student-'+selected.id+'-'+q.id+'\')">▶ Aufnahme anhören</button>':''}<label>Punkte (max. ${q.points}) <input type="number" min="0" max="${q.points}" value="${selected.marks?.[q.id]??(q.type==='mcq'?(selected.answers?.[q.id]===Number(q.answer)?q.points:0):'')}" onchange="mark('${selected.id}','${q.id}',this.value)"></label></div>`}).join('')}</section>`).join('');modal('Einsendung bewerten',selected.name+' · Automatische MCQ-Punkte: '+autoScore(selected),html+`<div class="modalfoot"><b>Bewertung: ${totalMark(selected)} / 60</b><button class="primary" onclick="completeMark('${selected.id}')">Bewertung abschließen ✓</button><button class="btn" onclick="exportOne('${selected.id}')">Export</button></div>`)}
function completeMark(id){let a=state.attempts.find(x=>x.id===id);a.status='graded';save();document.getElementById('modalroot').remove();render();toast('Bewertung gespeichert.')}
function adminRender(){let body='';if(tab==='attempts'){body=`<div class="stats"><div class="stat"><small>EINSENDUNGEN</small><b>${state.attempts.length}</b></div><div class="stat"><small>BEWERTET</small><b>${state.attempts.filter(a=>a.status==='graded').length}</b></div><div class="stat"><small>OFFEN</small><b>${state.attempts.filter(a=>a.status!=='graded').length}</b></div></div>${state.attempts.length?state.attempts.map(a=>`<div class="attempt"><div class="avatar">${esc(a.name[0]?.toUpperCase())}</div><div class="person"><b>${esc(a.name)}</b><small>${esc(a.email||'Keine E-Mail')} · ${new Date(a.started).toLocaleString('de-DE')}</small></div><span class="status ${a.status==='graded'?'graded':''}">${a.status==='graded'?'Bewertet':'Ausstehend'}</span><b class="score">${a.status==='graded'?totalMark(a):autoScore(a)} / 60</b><button class="iconbtn" onclick="openSubmission('${a.id}')">›</button></div>`).join(''):'<div class="empty"><b>Noch keine Einsendungen</b><p>Abgegebene Prüfungen werden hier angezeigt.</p></div>'}<p class="fine">Automatische Punkte gelten nur für Multiple-Choice-Aufgaben. Schreiben und Sprechen müssen manuell bewertet werden.</p>`}else if(tab==='questions'){body=`<div class="builder"><h3>Neue Aufgabe hinzufügen</h3><div class="buildergrid"><label>Prüfungsteil<select id="dsection" onchange="draft.section=this.value">${parts.map(s=>`<option value="${s.id}" ${draft.section===s.id?'selected':''}>${s.title}</option>`).join('')}</select></label><label>Aufgabentyp<select id="dtype" onchange="draft.type=this.value;render()"><option value="mcq" ${draft.type==='mcq'?'selected':''}>Multiple Choice</option><option value="text" ${draft.type==='text'?'selected':''}>Freitext</option><option value="recording" ${draft.type==='recording'?'selected':''}>Sprachaufnahme</option><option value="audio" ${draft.type==='audio'?'selected':''}>Hördatei abspielen</option></select></label><label>Punkte<input id="dpoints" type="number" min="1" max="15" value="${draft.points}" onchange="draft.points=this.value"></label></div><label class="field">Titel<input id="dprompt" value="${esc(draft.prompt)}" oninput="draft.prompt=this.value" placeholder="z. B. Teil 1 · Im Geschäft"></label><label class="field">Aufgabenstellung<textarea id="dquestion" rows="3" oninput="draft.question=this.value" placeholder="Aufgabenanweisung…">${esc(draft.question)}</textarea></label>${draft.type==='mcq'?'<div class="buildergrid">'+[0,1,2].map(i=>`<label>Antwort ${i+1}<input id="opt${i}" value="${esc(draft.options[i])}" oninput="draft.options[${i}]=this.value"></label>`).join('')+'</div><label class="field">Richtige Antwort<select id="danswer" onchange="draft.answer=Number(this.value)"><option value="0">Antwort 1</option><option value="1">Antwort 2</option><option value="2">Antwort 3</option></select></label>':''}<button class="primary" onclick="addQuestion()">+ Aufgabe hinzufügen</button></div>${parts.map(s=>`<div class="bank"><h3>${s.title} <small>${state.questions[s.id].length} Aufgaben</small></h3>${state.questions[s.id].map(q=>`<div class="bankrow"><div><b>${esc(q.prompt)}</b><small>${esc(q.question)}</small></div>${s.id==='hoeren'?'<label class="upload">Audio hochladen<input type="file" accept="audio/*" onchange="uploadAudio(\''+q.id+'\',this.files[0])"></label>':''}<button class="iconbtn" onclick="delQuestion('${s.id}','${q.id}')">×</button></div>`).join('')||'<small class="fine">Noch keine Aufgaben hinterlegt.</small>'}</div>`).join('')}` }else{body=`<div class="settings"><h3>Admin-Passwort ändern</h3><label class="field">Neues Passwort<input id="newpass" type="password" placeholder="Mindestens 8 Zeichen"></label><button class="primary" onclick="changePass()">Passwort ändern</button><div class="warning">Diese Plattform speichert Prüfungen und Aufnahmen nur in diesem Browserprofil. Der Admin-Zugang ist ein lokaler Schutz und keine serverseitige Authentifizierung. Browserdaten löschen oder ein anderer Computer bedeutet, dass Daten nicht automatisch synchronisiert werden.</div></div>`}return `<div class="admin"><div class="adminhead"><div><span class="kicker">PRÜFUNGSVERWALTUNG</span><h1>Admin Dashboard</h1><p>Prüfungsaufgaben, Einsendungen und Bewertungen verwalten.</p></div><div class="adminactions"><button class="btn" onclick="backup()">↓ Backup exportieren</button><label class="btn">↑ Backup importieren<input hidden type="file" accept="application/json" onchange="restore(this.files[0])"></label><button class="btn" onclick="admin=false;home()">Abmelden</button></div></div><div class="tabs"><button class="${tab==='attempts'?'active':''}" onclick="adminTab('attempts')">Einsendungen (${state.attempts.length})</button><button class="${tab==='questions'?'active':''}" onclick="adminTab('questions')">Fragen verwalten</button><button class="${tab==='settings'?'active':''}" onclick="adminTab('settings')">Einstellungen</button></div><div class="adminbody">${body}</div></div>`}
async function changePass(){let p=document.getElementById('newpass').value;if(p.length<8){toast('Mindestens 8 Zeichen.');return}state.config.hash=await hash(p);save();toast('Passwort geändert.')}
function download(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function b64(blob){return new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.readAsDataURL(blob)})}
async function backup(){let media=[];for(let a of state.attempts)for(let id of a.recorded||[]){let b=await get('student-'+a.id+'-'+id);if(b)media.push({key:'student-'+a.id+'-'+id,data:await b64(b),type:b.type})}for(let s of parts)for(let q of state.questions[s.id]){let b=await get('question-'+q.id);if(b)media.push({key:'question-'+q.id,data:await b64(b),type:b.type})}download(JSON.stringify({format:'goethe-a1-backup-v1',state,media}),'goethe-a1-backup.json','application/json')}
async function restore(file){if(!file)return;try{let p=JSON.parse(await file.text());if(p.format!=='goethe-a1-backup-v1')throw 0;state=p.state;for(let m of p.media||[]){let bytes=Uint8Array.from(atob(m.data),c=>c.charCodeAt(0));await put(m.key,new Blob([bytes],{type:m.type}))}save();render();toast('Backup importiert.')}catch(e){toast('Backup-Datei ungültig.')}}
async function exportOne(id){let a=state.attempts.find(x=>x.id===id),media=[];for(let qid of a.recorded||[]){let b=await get('student-'+id+'-'+qid);if(b)media.push({questionId:qid,data:await b64(b),type:b.type})}download(JSON.stringify({attempt:a,media},null,2),'pruefung-'+a.name.replace(/[^a-z0-9]/gi,'-')+'.json','application/json')}
function renderHome(){return `<div class="wrap"><section class="hero"><div class="eyebrow">DEUTSCH ALS FREMDSPRACHE</div><h1>Dein erster Schritt.<br><em>Auf Deutsch.</em></h1><p>Eine A1-Modellprüfung mit vier Prüfungsteilen: Hören, Lesen, Schreiben und Sprechen. Klar strukturiert und direkt im Browser.</p><div class="meta"><span>◷ &nbsp;80 Minuten</span><span>▤ &nbsp;4 Prüfungsteile</span><span>✧ &nbsp;60 Punkte</span></div></section><div class="layout"><section><div class="headrow"><div><span class="kicker">DIE PRÜFUNG</span><h2>Vier Teile. Ein Ziel.</h2></div><span class="pill">60 PUNKTE</span></div><div class="sections">${parts.map(s=>`<div class="section"><div class="sicon">${s.icon}</div><div class="sinfo"><b>${s.title}</b><small>${s.en} · ${s.desc}</small></div><div class="smeta"><b>${s.time} min</b><small>${s.points} Punkte</small></div></div>`).join('')}</div><div class="notice">✓ Deine Antworten und Sprachaufnahmen werden lokal in diesem Browser gespeichert. Es ist kein Konto und kein externer Backend-Dienst erforderlich.</div><div class="warning">Hinweis: Die bereitgestellte Musterprüfung enthält keine Audiodateien. Deshalb sind Hör-Aufgaben zunächst leer. Die Prüfungsleitung muss die Original-Hördateien und Aufgaben im Admin-Bereich ergänzen. Es werden keine Hörtexte erfunden.</div></section><aside class="start"><span class="kicker">BEREIT ZU STARTEN?</span><h3>Prüfung starten</h3><p>Trage deinen Namen ein. Deine Prüfungszeit beginnt mit dem Start.</p><label class="field">Dein Name<input id="candidateName" placeholder="Vor- und Nachname" value="${esc(candidate.name)}" oninput="candidate.name=this.value"></label><label class="field">E-Mail <small>(optional)</small><input id="candidateEmail" type="email" placeholder="name@example.com" value="${esc(candidate.email)}" oninput="candidate.email=this.value"></label><button class="primary" onclick="start()">Prüfung beginnen →</button><small class="fine">Automatische Speicherung während der Prüfung.</small></aside></div><footer class="footer"><span>GOETHE A1 · START DEUTSCH 1</span><span>Lokale Lern- und Prüfungsumgebung</span></footer></div>`}
function renderExam(){let s=parts[part],qs=questions(),q=qs[qi];let pct=((part+(qi+1)/Math.max(qs.length,1))/4)*100;return `<div class="exam"><div class="examhead"><div><span class="kicker">GOETHE-ZERTIFIKAT A1</span><h2>${s.title} <small>/ ${s.en}</small></h2></div><div class="timer"><b id="timer">${fmt(remaining)}</b><small>VERBLEIBEND</small></div></div><div class="progress"><span style="width:${pct}%"></span></div><div class="examgrid"><aside class="side"><div class="side-title">PRÜFUNGSÜBERSICHT</div>${parts.map((p,i)=>`<button class="${i===part?'active':i<part?'done':''}" ${i<=part?'onclick="jumpPart('+i+')"':'disabled'}><span>${i<part?'✓':'0'+(i+1)}</span><span>${p.title}<small>${p.time} Minuten</small></span></button>`).join('')}<div class="sidecount">Frage ${qs.length?qi+1:0} von ${qs.length}</div></aside><section class="question"><div class="qmeta">TEIL ${part+1} · FRAGE ${qi+1}</div>${q?`<span class="points">${q.points} Punkte</span><h3>${esc(q.prompt)}</h3><p class="instruction">${esc(q.question)}</p>${q.passage?'<div class="passage">'+esc(q.passage)+'</div>':''}${q.type==='mcq'?'<div class="options">'+(q.options||[]).map((o,i)=>`<button class="option ${answers[q.id]===i?'chosen':''}" onclick="setAns('${q.id}',${i});render()"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join('')+'</div>':''}${q.type==='text'?'<textarea class="answer" rows="7" placeholder="Schreiben Sie Ihre Antwort hier…" oninput="setText(\''+q.id+'\',this.value)">'+esc(written[q.id]||'')+'</textarea>':''}${q.type==='recording'?'<div class="record"><div class="recordicon">♫</div><div class="recordinfo"><b>'+(recorded[q.id]?'Aufnahme gespeichert':'Ihre Antwort aufnehmen')+'</b><small>'+(recorded[q.id]?'Sie können eine neue Aufnahme erstellen.':'Mikrofonzugriff erlauben und deutlich sprechen.')+'</small></div><button id="recordbtn" class="primary" onclick="recordStart(\''+q.id+'\')">'+(recorded[q.id]?'Erneut aufnehmen':'Aufnahme starten')+' ●</button></div>':''}${(q.type==='audio'||part===0)?'<div class="record"><div class="recordicon">♫</div><div class="recordinfo"><b>Hörtext</b><small>Hören Sie die Audiodatei und beantworten Sie die Frage.</small></div><button class="btn" onclick="play(\'question-'+q.id+'\')">▶ Audio abspielen</button></div>':''}`: '<div class="empty"><b>Für diesen Prüfungsteil wurden noch keine Aufgaben hinterlegt.</b><p>Die Prüfungsleitung muss die Originalaufgaben und – falls nötig – Audiodateien im Admin-Bereich hinzufügen. Die bereitgestellte PDF enthält keine Hördateien.</p></div>'}<div class="qnav"><button class="btn" onclick="prevQ()" ${qi===0?'disabled':''}>← Zurück</button><span>${qs.length?qi+1:0} / ${qs.length}</span><button class="primary" onclick="${qi<qs.length-1?'nextQ()':part<3?'advancePart(false)':'confirmFinish()'}">${qi<qs.length-1?'Weiter →':part<3?'Nächster Teil →':'Prüfung abgeben ✓'}</button></div></section></div><div class="examfoot"><span>Dein Fortschritt wird automatisch gespeichert.</span><button class="link" onclick="confirmFinish()">Vorzeitig abgeben</button></div></div>`}
function jumpPart(i){if(i>part)return;part=i;qi=0;remaining=parts[i].time*60;persist();runTimer();render()}
function prevQ(){if(qi>0){qi--;persist();render()}else if(part>0){part--;qi=Math.max(0,questions().length-1);remaining=parts[part].time*60;persist();runTimer();render()}}
function confirmFinish(){if(confirm('Prüfung jetzt abgeben?'))finish(false)}
function render(){let app=document.getElementById('app');if(screen==='home')app.innerHTML=renderHome();else if(screen==='exam')app.innerHTML=renderExam();else if(screen==='result')app.innerHTML='<div class="result"><div class="resulticon">✓</div><span class="kicker">PRÜFUNG ABGEGEBEN</span><h1>Sehr gut gemacht.</h1><p>Deine Antworten und Sprachaufnahmen wurden auf diesem Gerät gespeichert. Die Prüfungsleitung kann deine Antworten im Admin-Bereich prüfen und bewerten.</p><button class="primary" onclick="home()">Zur Startseite →</button></div>';else if(screen==='admin')app.innerHTML=adminRender()}
if(state.activeAttempt){attempt=state.activeAttempt.attempt;answers=state.activeAttempt.answers||{};written=state.activeAttempt.written||{};recorded=state.activeAttempt.recorded||{};part=state.activeAttempt.part||0;qi=state.activeAttempt.qi||0;remaining=state.activeAttempt.remaining||parts[part].time*60;screen='exam';runTimer()}render();
</script></body></html>
